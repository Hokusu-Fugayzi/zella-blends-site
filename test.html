<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zella Blends</title>
  <link rel="icon" type="image/png" href="images/zella logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="test.css">
</head>
<body class="home">
  <main class="stage">
    <video class="bg-video" autoplay muted loop playsinline poster="images/signature-bundle.webp">
      <source src="images/hero-video.mp4" type="video/mp4">
    </video>
    <div class="bg-overlay"></div>

    <header class="site-header">
      <a href="test.html" class="logo">
        <img src="images/ZELLA JUST MINI.png" alt="ZB">
        <span class="logo-word">Zella Blends</span>
      </a>
      <nav class="top">
        <a href="ritual.html">Ritual</a>
        <a href="story.html">Story</a>
        <a href="products.html">All Products</a>
        <a href="#" class="cart" aria-label="Cart">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 4h2.2l1.5 11a2 2 0 0 0 2 1.7h8.6a2 2 0 0 0 2-1.6L21 8H6"/>
            <circle cx="9.5" cy="20" r="1.2"/>
            <circle cx="17" cy="20" r="1.2"/>
          </svg>
          <span class="label-hide">Bag</span>
        </a>
      </nav>
    </header>

    <section class="center">
      <div class="eyebrow">Stones · Oils · Intention</div>
      <img class="brand-mark" src="images/ZELLA JUST MINI.png" alt="">
      <h1 class="brand">Zella Blends</h1>
      <div class="tagline">crystal-infused <em>·</em> handcrafted <em>·</em> intentional</div>
    </section>

    <section class="home-strip" aria-label="Featured blends">
      <a class="home-card" href="products.html#earth">
        <img src="images/earth-blend.webp" alt="">
        <div class="meta">
          <span class="name">Earth</span>
          <span class="desc">Grounding · 0.33 fl oz</span>
        </div>
        <span class="price">$32</span>
      </a>
      <a class="home-card" href="products.html#air">
        <img src="images/air-blend.webp" alt="">
        <div class="meta">
          <span class="name">Air</span>
          <span class="desc">Clarity · 0.33 fl oz</span>
        </div>
        <span class="price">$32</span>
      </a>
      <a class="home-card" href="products.html#fire">
        <img src="images/fire-blend.webp" alt="">
        <div class="meta">
          <span class="name">Fire</span>
          <span class="desc">Vitality · 0.33 fl oz</span>
        </div>
        <span class="price">$32</span>
      </a>
      <a class="home-card" href="products.html#water">
        <img src="images/water-blend.webp" alt="">
        <div class="meta">
          <span class="name">Water</span>
          <span class="desc">Flow · 0.33 fl oz</span>
        </div>
        <span class="price">$32</span>
      </a>
